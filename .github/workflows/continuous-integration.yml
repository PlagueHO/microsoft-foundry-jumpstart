name: Continuous Integration

on:
  push:
    paths:
      - src/**
      - tests/**
      - samples/**
      - tools/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    uses: ./.github/workflows/lint-markdown.yml

  lint-and-publish-bicep:
    name: Lint and Publish Bicep
    uses: ./.github/workflows/lint-and-publish-bicep.yml

  lint-and-test-python-apps:
    name: Lint and Test Python Apps
    uses: ./.github/workflows/lint-and-test-python-apps.yml
    with:
      # List all app names (folders) in tools/python/src/ and tools/python/tests/ that should be tested
      app_names: '["data_generator","create_ai_search_index"]'

  lint-and-test-dotnet-apps:
    name: Lint and Test .NET Apps
    uses: ./.github/workflows/lint-and-test-dotnet-apps.yml

  # Keep pull request analysis in the active CI workflow. GitHub can disable
  # the standalone scheduled CodeQL workflow after repository inactivity.
  codeql:
    name: CodeQL Analyze (${{ matrix.language }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: csharp
          - language: javascript-typescript
          - language: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
